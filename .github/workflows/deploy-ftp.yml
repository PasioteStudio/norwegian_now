name: Deploy frontend over FTPS

on:
  push:
    tags:
      - "ofo*"
      - "release*"

permissions:
  contents: read

concurrency:
  group: ftp-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci

      - name: Build static frontend
        run: npm run build

      - name: Upload static site artifact
        if: startsWith(github.ref, 'refs/tags/ofo') || startsWith(github.ref, 'refs/tags/release')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ofo') || startsWith(github.ref, 'refs/tags/release')
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/ofo') && 'ofo' || 'release' }}
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: out/

      - name: Validate FTP settings
        env:
          DEPLOY_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/ofo') && 'ofo' || 'release' }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret to the $DEPLOY_ENVIRONMENT environment under Settings > Environments."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit "$missing"
          fi

          case "$FTP_SERVER_DIR" in
            */) ;;
            *)
              echo "::error::FTP_SERVER_DIR must end with /."
              exit 1
              ;;
          esac

      - name: Deploy to web host over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
